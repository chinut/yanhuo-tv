name: Release

# 打 tag（形如 v1.0.0）时自动构建 APK 并发布 Release，
# App 内的「检查更新」会读取 Release 说明里的 versionCode 与 APK 附件。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本号（例如 v1.0.1）"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read version from build.gradle.kts
        id: ver
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/yanhuoTV-${{ steps.ver.outputs.name }}.apk"
          ls -l out

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 焰火TV ${{ steps.ver.outputs.name }}
          body: |
            焰火TV ${{ steps.ver.outputs.name }}

            versionCode: ${{ steps.ver.outputs.code }}
            versionName: ${{ steps.ver.outputs.name }}

            ### 更新内容
            - 见提交记录

            ### 安装说明
            1. 下载下面的 APK
            2. 电视/盒子用 U 盘或「当贝助手」等工具安装；也可以 adb install
            3. 首次安装需允许「安装未知来源应用」
          files: out/*.apk
          draft: false
          prerelease: false
