<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1920px;height:1080px;overflow:hidden;color:#eef2ff;
    font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 700px at 16% 10%, rgba(120,60,220,.52), transparent 62%),
      radial-gradient(950px 650px at 80% 90%, rgba(220,70,140,.40), transparent 60%),
      radial-gradient(1100px 800px at 50% 50%, #10142a, #070a15 78%);}

  /* 两角切：左上 + 右下 */
  .cut{clip-path:polygon(30px 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%, 0 30px)}

  /* ---------- 顶栏 ---------- */
  .head{display:flex;align-items:center;height:86px;padding:0 40px}
  .logo{width:62px;height:62px;border-radius:15px;background:linear-gradient(140deg,#7b4dff,#ff4d9d);
    display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
  .brand{margin-left:16px}
  .brand .n{font-size:34px;font-weight:800;letter-spacing:1px}
  .brand .s{font-size:16px;color:#9aa4c6;margin-top:2px;letter-spacing:3px}
  .head .r{margin-left:auto;display:flex;align-items:center;gap:22px}
  .clock{font-size:24px;font-weight:600}.clock small{color:#9aa4c6;font-weight:400}
  .gear{width:58px;height:58px;border-radius:15px;border:3px solid rgba(150,170,255,.55);
    display:flex;align-items:center;justify-content:center;font-size:28px}

  /* ---------- 主体 ---------- */
  .main{display:flex;gap:26px;padding:10px 40px 30px;height:964px}

  /* ===== 左：直播，近似 4:3 宽幅 ===== */
  .hero-wrap{flex:1;display:flex;align-items:center}
  .hero{width:100%;aspect-ratio:4/3;max-height:100%;position:relative;
    border:4px solid #6fb6ff;
    background:linear-gradient(160deg,#1a2340,#0d1226);
    box-shadow:0 0 46px rgba(90,170,255,.45), inset 0 0 90px rgba(0,0,0,.5)}
  .hero .tag{position:absolute;left:32px;top:28px;font-size:21px;color:#cfe0ff;
    background:rgba(10,16,32,.72);padding:7px 15px;border-radius:8px}
  .hero .txt{position:absolute;left:34px;bottom:30px}
  .hero .live{display:flex;align-items:center;gap:10px;font-size:20px;color:#d6dcf5;margin-bottom:12px}
  .hero .live i{width:12px;height:12px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 12px #ff4d6d}
  .hero .cname{font-size:56px;font-weight:900}
  .hero .hint{font-size:17px;color:#8f9ac0;margin-top:8px}

  /* ===== 右：两个竖版按钮 ===== */
  .side{width:440px;display:flex;flex-direction:column;gap:20px}
  .card{flex:1;position:relative;overflow:hidden;border:3px solid rgba(255,255,255,.20)}
  .card .ph{position:absolute;inset:0;background-size:cover;background-position:center 26%}
  .card .scrim{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(6,9,20,.06) 0%,rgba(6,9,20,.30) 46%,rgba(6,9,20,.78) 78%,rgba(6,9,20,.93) 100%)}
  .card .txt{position:absolute;left:30px;right:30px;bottom:28px;display:flex;align-items:flex-end;gap:16px}
  .card .badge{width:58px;height:58px;border-radius:14px;display:flex;align-items:center;
    justify-content:center;font-size:28px;flex:0 0 auto}
  .card .t{font-size:36px;font-weight:900;line-height:1.1}
  .card .s{font-size:17px;color:#b9c2dd;margin-top:6px}

  .card.movie .ph{background:
    radial-gradient(320px 420px at 50% 30%, rgba(255,210,150,.62), transparent 70%),
    repeating-linear-gradient(118deg,#4a3b2a 0 20px,#5a4832 20px 40px)}
  .card.movie .badge{background:linear-gradient(150deg,#c8783c,#8a4a22)}
  .card.drama .ph{background:
    radial-gradient(320px 420px at 52% 28%, rgba(255,190,225,.60), transparent 70%),
    repeating-linear-gradient(72deg,#3a2a3f 0 20px,#4a3550 20px 40px)}
  .card.drama .badge{background:linear-gradient(150deg,#a05bc8,#6a2f8a)}

  /* 人脸示意 */
  .face{position:absolute;width:132px;height:132px;border-radius:50%;
    border:3px dashed rgba(255,255,255,.62);left:50%;top:32%;transform:translate(-50%,-50%);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;
    background:rgba(0,0,0,.28);text-align:center;line-height:1.35}

  /* 标注 */
  .tag-note{position:absolute;font-size:17px;line-height:1.45;color:#8ff0c8;
    background:rgba(6,26,20,.86);border:2px solid #2fd39a;border-left:6px solid #2fd39a;
    border-radius:8px;padding:9px 13px;z-index:50;max-width:320px}
</style>
</head>
<body>

<div class="head">
  <div class="logo">焰</div>
  <div class="brand"><div class="n">焰火TV</div><div class="s">焰火随想　美好随现</div></div>
  <div class="r">
    <div class="clock">2026年10月4日　<small>22:48</small></div>
    <div class="gear">⚙</div>
  </div>
</div>

<div class="main">

  <!-- ============ 左：直播 4:3 ============ -->
  <div class="hero-wrap">
    <div class="hero cut">
      <div class="tag">CCTV 1 综合</div>
      <div class="txt">
        <div class="live"><i></i>正在直播</div>
        <div class="cname">CCTV-1 综合</div>
        <div class="hint">按「确定」进入全屏 · 上下键换台</div>
      </div>
      <div class="tag-note" style="right:24px;top:24px">
        <b>① 直播保持近似 4:3 宽幅</b><br>
        （按你说的，不做竖版）<br>
        四个角改成<b>切角</b>
      </div>
      <div class="tag-note" style="left:24px;bottom:24px;color:#ffd98a;
        background:rgba(32,22,4,.88);border-color:#ffb43d;border-left-color:#ffb43d">
        <b>切角位置：左上 + 右下</b>（照参考图，只切这两个角）
      </div>
    </div>
  </div>

  <!-- ============ 右：两个竖版按钮 ============ -->
  <div class="side">

    <div class="card movie cut">
      <div class="ph"></div>
      <div class="face">人脸区域<br>完整可见</div>
      <div class="scrim"></div>
      <div class="txt">
        <div class="badge">▣</div>
        <div>
          <div class="t">影视</div>
          <div class="s">影视库 12 部</div>
        </div>
      </div>
      <div class="tag-note" style="right:16px;top:16px">
        <b>② 竖版</b>（高 &gt; 宽）<br>左上+右下切角
      </div>
    </div>

    <div class="card drama cut">
      <div class="ph"></div>
      <div class="face">人脸区域<br>完整可见</div>
      <div class="scrim"></div>
      <div class="txt">
        <div class="badge">▶</div>
        <div>
          <div class="t">短剧</div>
          <div class="s">竖屏短剧 · 自动连播</div>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
