<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
/* ==========================================================================
   首页背景 · 电影感自然风光（按 5 张参考图取色）
   ---------------------------------------------------------------------------
   五张图的共同规律（实测）：
     明度 V≈0.29~0.41  → **暗调**，不是高明度
     饱和 S≈0.25~0.42  → 低饱和，克制
     **最亮处在上中 22%**（云被霞光照亮），不是地平线
     结构：冷蓝灰(顶) → 玫瑰紫(上中·最亮) → 暖褐(中下) → 深墨(底)
   所以这张图的感觉来自「**暗调 + 云层被霞光打亮**」，
   而不是「明亮的青白渐变」。
   ========================================================================== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{position:relative;overflow:hidden;
  font-family:"SF Pro Display","SF Pro Text",-apple-system,"Microsoft YaHei UI",
              "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;color:#fff}

/* ---------------- 天空：暗调 + 上中暖带 ---------------- */
.sky{position:absolute;inset:0;
  background:linear-gradient(180deg,
    #47507A 0%,      /* 天顶 冷蓝（提亮） */
    #6B6288 11%,
    #9C7C94 20%,     /* 上中：玫瑰紫（最亮） */
    #AC878E 27%,     /* 暖带峰值 */
    #8A6A7C 38%,
    #665060 50%,
    #564657 64%,
    #4F4353 78%,
    #493E4C 90%,
    #433846 100%)}

/* 云层：横向拉长的大模糊椭圆，压在上中暖带上下，
   制造"云被霞光照亮、云缝里透出冷天"的层次 */
.cloud{position:absolute;border-radius:50%;filter:blur(80px);mix-blend-mode:screen}
.k1{width:2000px;height:280px;left:-180px;top:8%;opacity:.30;
  background:radial-gradient(ellipse at center,#A8708C 0%,rgba(168,112,140,0) 72%)}
.k2{width:2200px;height:220px;left:-260px;top:19%;opacity:.40;
  background:radial-gradient(ellipse at center,#E8A184 0%,rgba(232,161,132,0) 70%)}
.k3{width:1800px;height:200px;left:-60px;top:31%;opacity:.24;
  background:radial-gradient(ellipse at center,#8B6A80 0%,rgba(139,106,128,0) 72%)}
.k4{width:1600px;height:240px;right:-300px;top:2%;opacity:.20;
  background:radial-gradient(ellipse at center,#6E7BA8 0%,rgba(110,123,168,0) 72%)}
/* 天顶一层更冷的蓝，把上缘压住 */
.topcool{position:absolute;left:0;right:0;top:0;height:24%;
  /* 原来 .55 把天顶压成 #404263，比参考的 #6B6080 暗了 0.13。
     减到 .30 让冷蓝"显色"而不是"压黑"。 */
  background:radial-gradient(1500px 620px at 48% -10%,
    rgba(86,110,180,.22) 0%,rgba(86,110,180,0) 72%)}
/* 底部压深：给卡片一个安静的底座 */
.floordark{position:absolute;left:0;right:0;bottom:0;height:50%;
  /* 只做很轻的一层：目的是让卡片下方"沉"一点，
     不是把画面压黑。参考图底部仍有岩面/水面的可见层次。 */
  background:linear-gradient(180deg,
    rgba(40,36,52,0) 0%,
    rgba(40,36,52,.10) 46%,
    rgba(36,32,48,.18) 100%)}

/* 远山剪影：只压最下缘，非常淡 */
/* 山峦剪影去掉了：参考图里山是**主体**，而首页背景只是衬托。
   留着会在底部形成一条抢眼的深色折线，反而显得廉价。
   改成"云" —— 大模糊、几乎无形的横向色带，贴近参考图的天空质感。 */
.haze{position:absolute;left:-10%;right:-10%;bottom:6%;height:26%;
  filter:blur(70px);opacity:.30;mix-blend-mode:screen;
  background:radial-gradient(ellipse at 50% 60%,
    rgba(150,120,150,.55) 0%,rgba(150,120,150,0) 72%)}

/* 极细颗粒 */
.grain{position:absolute;inset:0;opacity:.05;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}

/* ================= 顶部栏 ================= */
.head{position:absolute;left:0;top:0;width:100%;height:150px;
  display:flex;align-items:center;padding:0 64px}
.logo{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;
  justify-content:center;font-size:26px;font-weight:600;color:#fff;
  background:linear-gradient(150deg,#C97B8E,#8A6BA8 55%,#5E7BB8);
  box-shadow:0 8px 22px rgba(10,10,20,.42),inset 0 1px 0 rgba(255,255,255,.50)}
.brand{margin-left:17px}
.brand .n{font-size:31px;font-weight:600;letter-spacing:.3px;color:#F4F0F2;
  text-shadow:0 2px 16px rgba(6,6,14,.55)}
.brand .s{font-size:14px;font-weight:400;letter-spacing:3.4px;color:#A9A2AE}
.head .r{margin-left:auto;display:flex;align-items:center;gap:18px}
.clockbox{display:flex;align-items:center;gap:18px;padding:12px 22px 12px 24px;
  border-radius:20px;
  background:linear-gradient(160deg,rgba(255,255,255,.115),rgba(255,255,255,.045));
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 10px 30px rgba(6,6,14,.42),inset 0 1px 0 rgba(255,255,255,.26)}
.clockbox .d{font-size:16px;font-weight:400;color:#B6AFBA}
.clockbox .t{font-size:22px;font-weight:600;color:#F4F0F2;font-variant-numeric:tabular-nums}
.gear{width:56px;height:56px;border-radius:999px;display:flex;align-items:center;
  justify-content:center;font-size:24px;color:#DED8E2;
  background:linear-gradient(160deg,rgba(255,255,255,.115),rgba(255,255,255,.045));
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 10px 26px rgba(6,6,14,.38),inset 0 1px 0 rgba(255,255,255,.26)}

/* ================= 卡片 ================= */
.card{position:absolute;overflow:hidden;border-radius:48px;
  background:linear-gradient(168deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.035) 44%,rgba(255,255,255,.02) 100%);
  box-shadow:
    0 34px 80px rgba(4,5,12,.62),
    0 8px 22px rgba(4,5,12,.38),
    inset 0 1px 0 rgba(255,255,255,.30),
    inset 0 -1px 0 rgba(255,255,255,.06),
    inset 0 0 0 1px rgba(255,255,255,.10)}
.bar1,.bar2{border-radius:40px}

.big {left:127px; top:207px; width:842px; height:747px}
.bar1{left:1001px;top:207px; width:380px; height:747px}
.bar2{left:1413px;top:207px; width:380px; height:747px}

.big.focused{box-shadow:
  0 0 0 2px rgba(255,255,255,.85),
  0 40px 92px rgba(4,5,12,.66),
  inset 0 1px 0 rgba(255,255,255,.36)}

/* ---------------- 大卡：直播 ---------------- */
.video{position:absolute;inset:0;
  background:
    radial-gradient(660px 460px at 34% 28%, rgba(150,170,230,.24), transparent 72%),
    radial-gradient(560px 380px at 78% 62%, rgba(226,150,130,.20), transparent 74%),
    linear-gradient(168deg,#232744,#141628 76%)}
.veil{position:absolute;inset:0;
  background:linear-gradient(180deg,
    rgba(8,8,14,0) 0%,rgba(8,8,14,0) 44%,
    rgba(8,8,14,.52) 70%,rgba(8,8,14,.90) 100%)}

.itag{position:absolute;left:212px;top:56px;display:flex;align-items:center;gap:9px;
  padding:9px 18px;border-radius:999px;font-size:16px;font-weight:400;color:#F2EFF4;
  background:rgba(255,255,255,.13);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px rgba(255,255,255,.14)}
.itag i{width:8px;height:8px;border-radius:50%;background:#FF5A66;
  box-shadow:0 0 10px rgba(255,90,102,.9)}

.info{position:absolute;left:56px;bottom:54px}
.info .lv{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.info .lv i{width:9px;height:9px;border-radius:50%;background:#FF5A66;
  box-shadow:0 0 12px rgba(255,90,102,.9)}
.info .lv span{font-size:16px;font-weight:400;letter-spacing:1.8px;color:#D6D2DC}
.info .cn{font-size:60px;font-weight:600;letter-spacing:-.8px;line-height:1.02;color:#fff;
  text-shadow:0 3px 20px rgba(6,6,14,.60)}
.info .hint{font-size:22px;font-weight:400;margin-top:14px;color:#BEB8C4}

/* ---------------- 窄卡 ---------------- */
.ph{position:absolute;inset:0;background-size:cover;background-position:center 16%}
.psc{position:absolute;inset:0;
  background:linear-gradient(180deg,
    rgba(8,8,14,.30) 0%,rgba(8,8,14,.06) 26%,
    rgba(8,8,14,.54) 66%,rgba(8,8,14,.90) 100%)}
.btxt{position:absolute;left:30px;right:30px;bottom:52px}
.bdg{width:52px;height:52px;border-radius:18px;margin-bottom:17px;display:flex;
  align-items:center;justify-content:center;font-size:24px;color:#F2EFF4;
  background:rgba(255,255,255,.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px rgba(255,255,255,.14)}
.bti{font-size:40px;font-weight:600;letter-spacing:-.3px;color:#fff;
  text-shadow:0 2px 16px rgba(6,6,14,.56)}
.bsu{font-size:22px;font-weight:400;margin-top:10px;color:#C6C0CC}
</style>
</head>
<body>

  <div class="sky"></div>
  <div class="cloud k1"></div><div class="cloud k2"></div>
  <div class="cloud k3"></div><div class="cloud k4"></div>
  <div class="topcool"></div>
  <div class="haze"></div>
  <div class="floordark"></div>
  <div class="grain"></div>

  <!-- ============ 顶部栏 ============ -->
  <div class="head">
    <div class="logo">焰</div>
    <div class="brand">
      <div class="n">焰火TV</div>
      <div class="s">焰火随想　美好随现</div>
    </div>
    <div class="r">
      <div class="clockbox"><span class="d">2026年10月4日</span><span class="t">00:41</span></div>
      <div class="gear">⚙</div>
    </div>
  </div>

  <!-- ============ 大卡 ============ -->
  <div class="card big focused">
    <div class="video"></div>
    <div class="veil"></div>
    <div class="itag"><i></i>CCTV 1 综合</div>
    <div class="info">
      <div class="lv"><i></i><span>正在直播</span></div>
      <div class="cn">CCTV-1 综合</div>
      <div class="hint">按「确定」进入全屏 · 上下键换台</div>
    </div>
  </div>

  <!-- ============ 窄卡 ============ -->
  <div class="card bar1">
    <div class="ph" style="background-image:url('https://image.tmdb.org/t/p/w500/1E5baAaEse26fej7uHcjOgEE2t2.jpg')"></div>
    <div class="psc"></div>
    <div class="btxt"><div class="bdg">▣</div><div class="bti">影视</div><div class="bsu">影视库 12 部</div></div>
  </div>
  <div class="card bar2">
    <div class="ph" style="background-image:url('https://image.tmdb.org/t/p/w500/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg')"></div>
    <div class="psc"></div>
    <div class="btxt"><div class="bdg">▶</div><div class="bti">短剧</div><div class="bsu">竖屏短剧 · 自动连播</div></div>
  </div>

</body>
</html>
