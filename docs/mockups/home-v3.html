<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1920px;height:1080px;overflow:hidden;color:#eef2ff;
    font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1250px 720px at 15% 8%, rgba(118,58,218,.52), transparent 62%),
      radial-gradient(980px 660px at 84% 92%, rgba(220,70,140,.40), transparent 60%),
      radial-gradient(1100px 800px at 50% 50%, #10142a, #070a15 78%);}

  /* 切角：左上 + 右下 */
  .cut{clip-path:polygon(26px 0, 100% 0, 100% calc(100% - 26px), calc(100% - 26px) 100%, 0 100%, 0 26px)}

  /* ---------- 顶栏 ---------- */
  .head{display:flex;align-items:center;height:84px;padding:0 38px}
  .logo{width:60px;height:60px;border-radius:14px;background:linear-gradient(140deg,#7b4dff,#ff4d9d);
    display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:900}
  .brand{margin-left:16px}
  .brand .n{font-size:33px;font-weight:800;letter-spacing:1px}
  .brand .s{font-size:15px;color:#9aa4c6;margin-top:2px;letter-spacing:3px}
  .head .r{margin-left:auto;display:flex;align-items:center;gap:20px}
  .clock{font-size:23px;font-weight:600}.clock small{color:#9aa4c6;font-weight:400}
  .gear{width:56px;height:56px;border-radius:14px;border:3px solid rgba(150,170,255,.55);
    display:flex;align-items:center;justify-content:center;font-size:27px}

  /* ---------- 主体：三个区域并排 ---------- */
  .main{display:flex;gap:20px;padding:8px 38px 34px;height:962px}

  /* ===== 区域 1+2：直播（合并、最宽） ===== */
  .live{flex:0 0 1180px;position:relative;border:4px solid #6fb6ff;
    background:linear-gradient(160deg,#1a2340,#0d1226);
    box-shadow:0 0 46px rgba(90,170,255,.42), inset 0 0 90px rgba(0,0,0,.5)}
  .live .tag{position:absolute;left:30px;top:26px;font-size:20px;color:#cfe0ff;
    background:rgba(10,16,32,.72);padding:7px 15px;border-radius:8px}
  .live .txt{position:absolute;left:32px;bottom:28px}
  .live .row{display:flex;align-items:center;gap:10px;font-size:19px;color:#d6dcf5;margin-bottom:11px}
  .live .row i{width:11px;height:11px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 12px #ff4d6d}
  .live .cname{font-size:54px;font-weight:900}
  .live .hint{font-size:16px;color:#8f9ac0;margin-top:7px}

  /* 区域编号水印 */
  .num{position:absolute;font-size:120px;font-weight:900;color:rgba(255,255,255,.055);
    line-height:1;pointer-events:none}

  /* ===== 区域 3 / 4：竖条 ===== */
  .side{flex:1;display:flex;flex-direction:column;gap:20px}
  .card{flex:1;position:relative;overflow:hidden;border:3px solid rgba(255,255,255,.20)}
  .card .ph{position:absolute;inset:0;background-size:cover;background-position:center 24%}
  .card .scrim{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(6,9,20,.05) 0%,rgba(6,9,20,.28) 48%,rgba(6,9,20,.78) 80%,rgba(6,9,20,.93) 100%)}
  .card .txt{position:absolute;left:24px;right:24px;bottom:24px}
  .card .t{font-size:34px;font-weight:900;line-height:1.1}
  .card .s{font-size:16px;color:#b9c2dd;margin-top:6px}
  .card .badge{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;
    justify-content:center;font-size:25px;margin-bottom:12px}

  .card.movie .ph{background:
    radial-gradient(300px 400px at 50% 32%, rgba(255,210,150,.62), transparent 70%),
    repeating-linear-gradient(118deg,#4a3b2a 0 20px,#5a4832 20px 40px)}
  .card.movie .badge{background:linear-gradient(150deg,#c8783c,#8a4a22)}
  .card.drama .ph{background:
    radial-gradient(300px 400px at 52% 30%, rgba(255,190,225,.60), transparent 70%),
    repeating-linear-gradient(72deg,#3a2a3f 0 20px,#4a3550 20px 40px)}
  .card.drama .badge{background:linear-gradient(150deg,#a05bc8,#6a2f8a)}

  .face{position:absolute;width:126px;height:126px;border-radius:50%;
    border:3px dashed rgba(255,255,255,.60);left:50%;top:34%;transform:translate(-50%,-50%);
    display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;
    background:rgba(0,0,0,.26);text-align:center;line-height:1.35}

  /* 标注 */
  .note{position:absolute;font-size:16px;line-height:1.45;color:#8ff0c8;
    background:rgba(6,26,20,.88);border:2px solid #2fd39a;border-left:6px solid #2fd39a;
    border-radius:8px;padding:8px 12px;z-index:60;max-width:300px}
  .note b{color:#fff}
</style>
</head>
<body>

<div class="head">
  <div class="logo">焰</div>
  <div class="brand"><div class="n">焰火TV</div><div class="s">焰火随想　美好随现</div></div>
  <div class="r">
    <div class="clock">2026年10月4日　<small>22:55</small></div>
    <div class="gear">⚙</div>
  </div>
</div>

<div class="main">

  <!-- ========== 区域 1 + 2 ：直播（合并） ========== -->
  <div class="live cut">
    <div class="num" style="right:30px;bottom:10px">1·2</div>
    <div class="tag">CCTV 1 综合</div>
    <div class="txt">
      <div class="row"><i></i>正在直播</div>
      <div class="cname">CCTV-1 综合</div>
      <div class="hint">按「确定」进入全屏 · 上下键换台</div>
    </div>
    <div class="note" style="right:26px;top:96px">
      <b>区域 1+2 = 直播</b><br>
      两块合并成一个大区域，<br>因为它要显示直播画面
    </div>
  </div>

  <!-- ========== 区域 3 / 4 ========== -->
  <div class="side">

    <div class="card movie cut">
      <div class="num" style="right:8px;top:8px;font-size:70px">3</div>
      <div class="ph"></div>
      <div class="face">人脸<br>完整</div>
      <div class="scrim"></div>
      <div class="txt">
        <div class="badge">▣</div>
        <div class="t">影视</div>
        <div class="s">影视库 12 部</div>
      </div>
    </div>

    <div class="card drama cut">
      <div class="num" style="right:8px;top:8px;font-size:70px">4</div>
      <div class="ph"></div>
      <div class="face">人脸<br>完整</div>
      <div class="scrim"></div>
      <div class="txt">
        <div class="badge">▶</div>
        <div class="t">短剧</div>
        <div class="s">竖屏短剧 · 自动连播</div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
